[package]
name = "funcode"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = { version = "0.35", features = ["chat-completion"] }
async-trait = "0.1.89"
futures-util = "0.3"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
globset = "0.4"
ignore = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
dotenv = "0.15"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = "0.1"
